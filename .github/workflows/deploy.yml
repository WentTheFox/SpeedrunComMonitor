# "Sync to production" button for SpeedrunComMonitor.
#
# Images are built by images.yml; the cluster's Argo CD picks the newest one up by itself, but production is only changed on purpose.
# This workflow creates a GitHub Deployment with task "argocd-sync"; GitHub delivers it as a signed `deployment` webhook to the receiver
# in the cluster, which asks Argo CD to sync this app's production Application. Nothing is stored in GitHub Actions secrets, and the
# request cannot choose an image, revision or application. Only the latest deployment record per environment is kept.
#
# workflow_dispatch only, never automatic.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask Argo CD to sync production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(jq -n --arg ref "$GITHUB_SHA" \
                 '{ref: $ref, environment: "argocd-sync", task: "argocd-sync", auto_merge: false, required_contexts: [],
                   transient_environment: true, description: "Sync speedruncommonitor-prod"}' \
               | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "::notice::Sync requested (request $id). Follow it in Argo CD or the repository's Deployments."

      - name: Keep only the latest deployment record per environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=100" --paginate --jq '.[] | [.environment,.id] | @tsv' \
            | awk -F'\t' '!seen[$1]++ {next} {print $2}' | while read -r id; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive >/dev/null || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" >/dev/null || echo "::warning::could not delete deployment $id"
          done
