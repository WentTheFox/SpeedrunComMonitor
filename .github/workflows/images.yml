name: Publish container image

# Publishes ghcr.io/<owner>/speedruncommonitor, multi-arch, for EVERY push to main, tagged <sha7> and sha-<sha7>. There are no
# version tags, no `latest` and no git tags: the commit is the version. The sha-<sha7> tag is what Argo CD Image Updater follows and is
# added as the very last registry step. Each architecture is built natively on its own runner, pushed as <sha7>-<arch>, then merged.
on:
  push:
    branches: [ main ]

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  commitlint:
    # informational only: must not gate the image build (older upstream commits are not conventional)
    continue-on-error: true
    name: 'Lint commit messages'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  build:
    name: 'Build ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out names and tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/speedruncommonitor:${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --provenance=false --push -t "$IMAGE" \
            --cache-from type=gha,scope=${{ matrix.arch }} --cache-to type=gha,scope=${{ matrix.arch }},mode=max .

  publish:
    name: 'Publish multi-arch tags'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sha="${GITHUB_SHA:0:7}"
          repo="$registry/speedruncommonitor"
          docker buildx imagetools create -t "$repo:$sha" "$repo:$sha-amd64" "$repo:$sha-arm64"

      # Last registry step: the tag Image Updater follows is added only after the multi-arch manifest exists.
      - name: Add sha- tag
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/speedruncommonitor"
          sha="${GITHUB_SHA:0:7}"
          docker buildx imagetools inspect "$repo:$sha" > /dev/null
          docker buildx imagetools create -t "$repo:sha-$sha" "$repo:$sha"
